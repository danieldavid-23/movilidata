<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MedMovil OS - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: "Segoe UI", sans-serif; }
        .login-card { background: rgba(15,23,42,0.95); border-radius: 24px; padding: 40px; border: 1px solid rgba(99,102,241,0.3); width: 100%; max-width: 400px; text-align: center; }
        .btn-login { background: linear-gradient(135deg,#6366f1,#8b5cf6); border: none; border-radius: 12px; padding: 12px; width: 100%; color: white; font-weight: bold; }
        .form-control { background: rgba(30,27,75,0.6); border: 1px solid rgba(99,102,241,0.3); color: white; border-radius: 12px; }
        .form-control:focus { background: rgba(30,27,75,0.8); border-color: #6366f1; color: white; }
    </style>
</head>
<body>
    <div class="login-card">
        <i class="fas fa-traffic-light fa-3x" style="color:#6366f1;"></i>
        <h2 class="text-white mt-2">MedMovil OS</h2>
        <p class="text-muted">Plataforma de Movilidad</p>
        <form id="loginForm">
            <div class="mb-3"><input type="email" class="form-control" id="email" placeholder="Correo" required></div>
            <div class="mb-3"><input type="password" class="form-control" id="password" placeholder="Contraseña" required></div>
            <button type="submit" class="btn-login">Iniciar Sesión</button>
        </form>
        <div class="mt-3"><small class="text-muted">demo@medmovil.com / demo123</small></div>
    </div>
    <script src="../js/auth/auth.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const res = window.auth.login(document.getElementById('email').value, document.getElementById('password').value);
            if(res.success) { window.location.href = '../index.html'; }
            else { alert(res.message); }
        });
    </script>
</body>
</html>
